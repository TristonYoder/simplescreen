openapi: 3.1.0
info:
  title: Simple Screen API
  version: 1.0.0
  description: |
    Contract for the Simple Screen server (product name configurable via branding.toml).
    Spec-first: the Rust server and Swift clients conform to this file.

    Conventions:
    - IDs are UUID strings. Timestamps are RFC 3339 strings (UTC).
    - The server is exactly one organization. Its `id` is the server's `server_id`; its name and
      IANA timezone are server settings (`GET`/`PATCH /v1/settings`, or env vars, which win).
      Users belong to Teams; "admin" means a server admin (`admin_groups` or the bootstrap token).
    - Org-scoped requests (user calls, including `GET /v1/ws`) may send `X-Organization: <id>`.
      If present it must equal this server's org id, else `404 organization_not_found`.
      Absent is accepted. Device tokens and unauthenticated endpoints ignore it.
    - Screens, nodes, floor plans, tags and media libraries belong to the org. Teams own content
      (playlist folders, playlists, schedule entries) and reach media folders through tags and grants. A team reaches a screen when its `screen_access` is `all`
      or the screen carries one of the team's tags. A playlist is available on a screen when they
      share a tag; an untagged playlist shows nowhere, and an untagged screen plays nothing and is
      reached by no team (only admins see it), whatever the team's `screen_access`.
    - Screen permissions: admins manage tags, team reach, screen tags, floor plans, node name and
      mode, and delete screens. Editors of a team that reaches a screen operate it (rename, place,
      fallback, timezone, override, commands, assignments that target it). Viewers of a reaching
      team see it. A screen the caller does not reach is 404.
    - Nodes are hardware only: they have no team and no tags, and grant nothing. An assignment
      (one output's job) is the node's whole grant to its target screen.
    - Schedules use wall-clock times in the screen's zone (`Screen.timezone`, else the org's
      `timezone`) (`HH:MM[:SS]`, `YYYY-MM-DDTHH:MM[:SS]`). Seconds are optional and come back only
      when non-zero. Resolved segments are UTC timestamps.
    - Media blobs are content-addressed by lowercase hex SHA-256 and immutable.
    - Errors always use the `Error` schema.
    - Auth: `Authorization: Bearer <token>`. Token is an OIDC JWT (users), the
      bootstrap token (server admin), or a device token (paired screens).
      Blob GET and the WebSocket also accept `?token=` for clients that cannot set headers.
    - A node is a paired device (an Apple TV, or a Mac/iPad that drives several outputs). A node owns the
      device token and one WebSocket, and plays one or more Screens through `program` outputs (every
      program output of a Screen shows identical frames, and all of them are on one node).
      An Apple TV is a single-screen node: device endpoints without `screen_id` use its only screen.
    - WebSocket message schemas are `WsServerMessage` / `WsClientMessage` (JSON text frames).
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
servers:
  - url: http://localhost:8420
security:
  - bearer: []
tags:
  - name: system
  - name: auth
  - name: organizations
  - name: settings
  - name: teams
  - name: libraries
  - name: media
  - name: blobs
  - name: playlists
  - name: nodes
  - name: screens
  - name: pairing
  - name: device
  - name: schedule
  - name: floor-plans
  - name: tags
  - name: notices

paths:
  /v1/info:
    get:
      operationId: getInfo
      tags: [system]
      security: []
      responses:
        '200':
          description: Server identity
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServerInfo' }

  /v1/auth/config:
    get:
      operationId: getAuthConfig
      tags: [auth]
      security: []
      responses:
        '200':
          description: OIDC parameters clients need to sign in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthConfig' }

  /v1/me:
    parameters:
      - { $ref: '#/components/parameters/OrganizationHeader' }
    get:
      operationId: getMe
      tags: [auth]
      responses:
        '200':
          description: Current principal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      operationId: updateMe
      tags: [auth]
      description: |
        Users and the bootstrap admin. `timezone` is a display preference only (IANA zone; null = the
        org's zone). Schedule times are always venue time. 422 `invalid_timezone`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MePatch' }
      responses:
        '200':
          description: Current principal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/me/organizations:
    get:
      operationId: listMyOrganizations
      tags: [organizations]
      description: |
        Organizations the caller can open. A self-hosted server always returns exactly its own org,
        `can_create: false` and no invites. A hosting gateway may return several orgs, invites and
        `can_create: true`; clients must not assume either. Ignores `X-Organization`.
      responses:
        '200':
          description: Organizations
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationList' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/organizations:
    post:
      operationId: createOrganization
      tags: [organizations]
      description: |
        Start a new organization (hosted gateway only). A self-hosted server always answers
        `403` with code `not_supported`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrganizationInput' }
      responses:
        '201':
          description: Created (gateway only)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/invites/{inviteId}/accept:
    parameters:
      - { $ref: '#/components/parameters/InviteId' }
    post:
      operationId: acceptInvite
      tags: [organizations]
      description: Join an organization from an invite (hosted gateway only). A self-hosted server has no invites and always answers `404`.
      responses:
        '200':
          description: Joined (gateway only)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/settings:
    parameters:
      - { $ref: '#/components/parameters/OrganizationHeader' }
    get:
      operationId: getSettings
      tags: [settings]
      description: Any signed-in user. The org's name and timezone.
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Settings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateSettings
      tags: [settings]
      description: |
        Server admin. First-run setup writes the org name and timezone here. Fields set by env vars
        are listed in `locked`; changing one fails with `409 setting_locked`. Changing the timezone
        re-resolves every schedule (devices get `manifest_changed`, user sockets `schedule_changed`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SettingsPatch' }
      responses:
        '200':
          description: Updated settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Settings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/teams:
    parameters:
      - { $ref: '#/components/parameters/OrganizationHeader' }
    get:
      operationId: listTeams
      tags: [teams]
      description: Teams the caller can see (all, for server admins).
      responses:
        '200':
          description: Teams
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Team' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createTeam
      tags: [teams]
      description: |
        Server admin only. `oidc_bindings` may be sent with the create, so the first team and its
        sign-in group → role mapping are set up in one call (Studio's "create first team" screen).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeamInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Team' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/teams/{teamId}:
    parameters:
      - { $ref: '#/components/parameters/OrganizationHeader' }
      - { $ref: '#/components/parameters/TeamId' }
    get:
      operationId: getTeam
      tags: [teams]
      responses:
        '200':
          description: Team
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Team' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateTeam
      tags: [teams]
      description: Server admin or team admin. Renames the team and replaces its sign-in groups; reach is set with `putTeamTags`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeamInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Team' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteTeam
      tags: [teams]
      description: Server admin only. Fails with 409 if the team still owns playlists.
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/teams/{teamId}/tags:
    parameters:
      - { $ref: '#/components/parameters/OrganizationHeader' }
      - { $ref: '#/components/parameters/TeamId' }
    put:
      operationId: putTeamTags
      tags: [teams]
      description: |
        Server admin only. Sets the team's reach: the tags it holds and, optionally, `screen_access`
        (`all` reaches every screen). A change that makes two existing one-off entries overlap on a
        screen still goes through: `clashes` lists them, both entries get `needs_resolution`, and their
        creators and the caller get a `schedule_conflict` notice. The newer entry plays until fixed.
        422 `invalid_tag`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeamTagsInput' }
      responses:
        '200':
          description: The team and any clashes the change caused
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamChange' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/teams/reach:
    parameters:
      - { $ref: '#/components/parameters/OrganizationHeader' }
    get:
      operationId: getTeamReach
      tags: [teams]
      description: Server admin only. Which screens each team reaches, for the Teams and Tags settings.
      responses:
        '200':
          description: Reach matrix
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamReach' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/tags:
    parameters:
      - { $ref: '#/components/parameters/OrganizationHeader' }
    get:
      operationId: listTags
      tags: [tags]
      description: Any signed-in user. Every tag in the org, by name.
      responses:
        '200':
          description: Tags
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Tag' }
    post:
      operationId: createTag
      tags: [tags]
      description: Server admin only. Names are unique ignoring case (409 `tag_exists`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TagInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tag' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/tags/{tagId}:
    parameters:
      - { $ref: '#/components/parameters/OrganizationHeader' }
      - { $ref: '#/components/parameters/TagId' }
    patch:
      operationId: updateTag
      tags: [tags]
      description: Server admin only. Rename or recolor.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TagPatch' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tag' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: deleteTag
      tags: [tags]
      description: |
        Server admin only. Removes the tag from every screen, team, playlist and schedule entry. Like
        any retag, the change goes through even if it makes one-off entries clash; `clashes` lists them.
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangeResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/tags/{tagId}/usage:
    parameters:
      - { $ref: '#/components/parameters/OrganizationHeader' }
      - { $ref: '#/components/parameters/TagId' }
    get:
      operationId: getTagUsage
      tags: [tags]
      description: Server admin only. What carries the tag.
      responses:
        '200':
          description: Usage
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TagUsage' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/blobs/{sha256}:
    parameters:
      - { $ref: '#/components/parameters/OrganizationHeader' }
      - { $ref: '#/components/parameters/Sha256' }
      - { $ref: '#/components/parameters/TokenQuery' }
    head:
      operationId: headBlob
      tags: [blobs]
      description: 200 if the blob exists (dedupe check before upload), else 404.
      responses:
        '200':
          description: Exists
          headers:
            Content-Length: { schema: { type: integer } }
        '404': { description: Missing }
    get:
      operationId: getBlob
      tags: [blobs]
      description: |
        Immutable bytes. Supports `Range` (206), `If-None-Match` (304).
        Response headers: `ETag: "<sha256>"`, `Cache-Control: public, max-age=31536000, immutable`,
        `Accept-Ranges: bytes`, `Content-Type` from the media record (or application/octet-stream).
        Files in the managed library and in local libraries are served directly. Files only in an S3
        library answer `302` to a presigned URL (or the library's CDN URL), with `Cache-Control: no-store`;
        clients must not forward their `Authorization` header to it.
      parameters:
        - name: Range
          in: header
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Full content
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '206':
          description: Partial content
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '302':
          description: The file is in an S3 library; fetch it from `Location`
          headers:
            Location: { schema: { type: string, format: uri } }
        '304': { description: Not modified }
        '404': { $ref: '#/components/responses/NotFound' }
        '416': { description: Range not satisfiable }
    put:
      operationId: putBlob
      tags: [blobs]
      description: |
        Upload raw bytes. Requires editor role in at least one team.
        Server streams to disk while hashing; rejects with 422 if the hash doesn't match the path.
        Idempotent: returns 200 if the blob already exists, 201 if newly stored. Used for thumbnails,
        floor plan images, and media going to the managed or a local library (`createMediaUpload` says
        which). 507 `insufficient_storage` when the server's disk is full.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: Already present
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BlobInfo' }
        '201':
          description: Stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BlobInfo' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '507': { $ref: '#/components/responses/InsufficientStorage' }

  /v1/libraries:
    parameters:
      - { $ref: '#/components/parameters/OrganizationHeader' }
    get:
      operationId: listLibraries
      tags: [libraries]
      description: |
        Any signed-in user. Every library, by position then name. Storage settings (`local`, `s3`) are
        included for server admins only. The managed library always exists.
      responses:
        '200':
          description: Libraries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Library' }
    post:
      operationId: createLibrary
      tags: [libraries]
      description: |
        Server admin only. A `local` path must be absolute and inside a root allowed by the server's
        `LIBRARY_ROOTS` setting (422 `path_not_allowed`); the directory is created if missing. An `s3`
        library needs `bucket`, `region`, `access_key_id` and `secret_access_key`. The server checks it
        can write to the storage first (422 `storage_unreachable`, with the cause in `params.detail`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LibraryInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Library' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/libraries/{libraryId}:
    parameters:
      - { $ref: '#/components/parameters/OrganizationHeader' }
      - { $ref: '#/components/parameters/LibraryId' }
    get:
      operationId: getLibrary
      tags: [libraries]
      description: Any signed-in user; storage settings for server admins only.
      responses:
        '200':
          description: Library
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Library' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateLibrary
      tags: [libraries]
      description: |
        Server admin only. Rename, reorder, set the quota, or change S3 settings (credentials, endpoint,
        CDN URL). The bucket, prefix and local path can't change once the library has files (409
        `library_not_empty`). Omitting `secret_access_key` keeps the stored one.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LibraryPatch' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Library' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      operationId: deleteLibrary
      tags: [libraries]
      description: Server admin only. Only an empty library (no folders) can be removed (409 `library_not_empty`); the managed library can't (409 `library_managed`). Files in storage are left alone.
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/libraries/test:
    parameters:
      - { $ref: '#/components/parameters/OrganizationHeader' }
    post:
      operationId: testLibrary
      tags: [libraries]
      description: |
        Server admin only. Checks that the server can write, read and delete a small file with these
        settings, without saving anything. Pass `library_id` to fill in the stored secret.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LibraryTestInput' }
      responses:
        '200':
          description: Result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibraryTestResult' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/media-folders:
    parameters:
      - { $ref: '#/components/parameters/OrganizationHeader' }
    get:
      operationId: listMediaFolders
      tags: [media]
      description: |
        Folders the caller reaches (every folder for admins), plus their ancestors with `access: none` so
        the tree can be drawn. A team reaches a folder through a tag it holds on the folder or an
        ancestor (or `screen_access: all`), or a grant to it on the folder or an ancestor. `team_id`
        narrows it to what that team reaches (viewer role).
      parameters:
        - name: library_id
          in: query
          required: false
          schema: { type: string }
        - name: team_id
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Folders, by library then path
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MediaFolder' }
    post:
      operationId: createMediaFolder
      tags: [media]
      description: |
        Top-level folders (no `parent_id`): server admin only. Subfolders: editor role in a team that
        reaches the parent. Names are unique among siblings ignoring case (409 `name_taken`) and may not
        contain `/` or start with `.` (400). The folder is created in storage too.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MediaFolderInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaFolder' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/media-folders/{folderId}:
    parameters:
      - { $ref: '#/components/parameters/OrganizationHeader' }
      - { $ref: '#/components/parameters/FolderId' }
    get:
      operationId: getMediaFolder
      tags: [media]
      responses:
        '200':
          description: Folder
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaFolder' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateMediaFolder
      tags: [media]
      description: |
        Editor role in a team that reaches the folder (moving it also needs that for the new parent;
        a top-level folder is renamed or moved by server admins only). Renames and moves happen in
        storage too. A folder can't move into itself or a descendant, or to another library (422
        `invalid_folder`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MediaFolderPatch' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaFolder' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      operationId: deleteMediaFolder
      tags: [media]
      description: |
        Editor role in a team that reaches the folder (top-level folders: server admins). Deletes the
        folder, its subfolders and their files, in storage too. Files that playlists use become missing,
        as with `deleteMedia`. `getMediaFolderUsage` shows what would be affected.
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/media-folders/{folderId}/tags:
    parameters:
      - { $ref: '#/components/parameters/OrganizationHeader' }
      - { $ref: '#/components/parameters/FolderId' }
    put:
      operationId: setMediaFolderTags
      tags: [media]
      description: |
        Editor role in a team that reaches the folder. Replaces the folder's own tags. Non-admins may
        add or remove only tags one of their editor teams holds (403 `tag_not_held`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TagIdsInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaFolder' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/media-folders/{folderId}/grants:
    parameters:
      - { $ref: '#/components/parameters/OrganizationHeader' }
      - { $ref: '#/components/parameters/FolderId' }
    put:
      operationId: setMediaFolderGrants
      tags: [media]
      description: Editor role in a team that reaches the folder. Replaces the teams the folder is granted to directly.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MediaFolderGrantsInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaFolder' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/media-folders/{folderId}/usage:
    parameters:
      - { $ref: '#/components/parameters/OrganizationHeader' }
      - { $ref: '#/components/parameters/FolderId' }
    get:
      operationId: getMediaFolderUsage
      tags: [media]
      description: Viewer role in a team that reaches the folder. Every playlist using any file in the folder or its subfolders, for the delete confirmation.
      responses:
        '200':
          description: Usage
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaUsage' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/media:
    parameters:
      - { $ref: '#/components/parameters/OrganizationHeader' }
    get:
      operationId: listMedia
      tags: [media]
      description: |
        Files in folders the caller reaches, plus files the caller's teams' playlists use (`access:
        playlist`, including missing ones). `folder_id` lists one folder (not its subfolders); `team_id`
        narrows to what that team reaches and uses (viewer role). `source_sha256` keeps files whose
        original bytes had that hash, so Studio can offer an existing file instead of uploading a copy.
      parameters:
        - name: folder_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: team_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: kind
          in: query
          required: false
          schema: { $ref: '#/components/schemas/MediaKind' }
        - name: source_sha256
          in: query
          required: false
          schema: { type: string, pattern: '^[0-9a-f]{64}$' }
      responses:
        '200':
          description: Media visible to the caller
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Media' }
    post:
      operationId: createMedia
      tags: [media]
      description: |
        Editor role in a team that reaches the folder. Finishes an upload started with
        `createMediaUpload`: the server checks the bytes are in place (422 `blob_missing`, or
        `hash_mismatch` for S3) and records the file at `<folder path>/<name>`. 409 `name_taken` if the
        folder already has a file with that name (ignoring case).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MediaInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Media' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/media/uploads:
    parameters:
      - { $ref: '#/components/parameters/OrganizationHeader' }
    post:
      operationId: createMediaUpload
      tags: [media]
      description: |
        Editor role in a team that reaches the folder. Says where to send the bytes of a new file:
        `putBlob` on this server for the managed and local libraries, or a presigned S3 `PUT` (which
        must carry the returned headers, including `x-amz-checksum-sha256`, so S3 checks the hash).
        S3 files larger than the library's part size come back with `multipart` instead of `url`:
        sign each part with `signMediaUploadParts`, `PUT` it, then call `completeMediaUpload`.
        `already_present` means the bytes are already stored and no upload is needed. Then call
        `createMedia`. 409 `name_taken`; 413 `file_too_large` (S3 objects are limited to 5 TiB);
        507 `insufficient_storage` when the file won't fit the library's free space or quota.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MediaUploadInput' }
      responses:
        '200':
          description: Where to upload
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaUpload' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '507': { $ref: '#/components/responses/InsufficientStorage' }

  /v1/media/uploads/{uploadId}:
    parameters:
      - { $ref: '#/components/parameters/OrganizationHeader' }
      - { $ref: '#/components/parameters/UploadId' }
    delete:
      operationId: abortMediaUpload
      tags: [media]
      description: The user who started the multipart upload. Abandons it and frees the parts in S3.
      responses:
        '204': { description: Aborted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/media/uploads/{uploadId}/parts:
    parameters:
      - { $ref: '#/components/parameters/OrganizationHeader' }
      - { $ref: '#/components/parameters/UploadId' }
    post:
      operationId: signMediaUploadParts
      tags: [media]
      description: |
        The user who started the multipart upload. Presigns `PUT`s for up to 100 parts, numbered from 1.
        Every part is `part_size` bytes except the last. Each `PUT` must carry the returned headers,
        including the part's `x-amz-checksum-sha256`, and its response's `ETag` goes to
        `completeMediaUpload`. Signing a part again (to retry it) replaces its hash.
        Unfinished uploads are aborted after 24 hours.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MediaUploadPartsInput' }
      responses:
        '200':
          description: One presigned PUT per part, in request order
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MediaUploadPart' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/media/uploads/{uploadId}/complete:
    parameters:
      - { $ref: '#/components/parameters/OrganizationHeader' }
      - { $ref: '#/components/parameters/UploadId' }
    post:
      operationId: completeMediaUpload
      tags: [media]
      description: |
        The user who started the multipart upload. Joins the parts into the file, then checks it has
        the declared size and the signed part hashes. 422 `upload_incomplete` if a part was never
        signed, has no ETag here, or S3 refused it; 422 `hash_mismatch` if the joined file doesn't
        match. Then call `createMedia`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MediaUploadCompleteInput' }
      responses:
        '204': { description: The file is in place }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/media/{mediaId}:
    parameters:
      - { $ref: '#/components/parameters/OrganizationHeader' }
      - { $ref: '#/components/parameters/MediaId' }
    get:
      operationId: getMedia
      tags: [media]
      description: Viewer role in a team that reaches its folder, or whose playlist uses it.
      responses:
        '200':
          description: Media
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Media' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateMedia
      tags: [media]
      description: |
        Editor role in a team that reaches its folder (and the target folder when moving). Renames and
        moves happen in storage; a move to another library copies the bytes, then deletes the old copy.
        The sha256 stays the same, so playlists keep working. 409 `name_taken`; 422 `media_missing` for a
        missing file; 507 `insufficient_storage`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MediaPatch' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Media' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '507': { $ref: '#/components/responses/InsufficientStorage' }
    delete:
      operationId: deleteMedia
      tags: [media]
      description: |
        Editor role in a team that reaches its folder. Deletes the file from storage. If playlists use it,
        the record stays with `missing: true`: players skip those items, manifests leave them out, and
        the last editor of each playlist gets a `media_missing` notice. `getMediaUsage` shows which
        playlists use it.
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/media/{mediaId}/replace:
    parameters:
      - { $ref: '#/components/parameters/OrganizationHeader' }
      - { $ref: '#/components/parameters/MediaId' }
    post:
      operationId: replaceMedia
      tags: [media]
      description: |
        Editor role in a team that reaches its folder. Swaps in new bytes uploaded with
        `createMediaUpload` (`replaces` set to this file) and keeps the id, so every playlist that uses
        it gets the new version: their versions bump and their screens get `manifest_changed`. The old
        bytes are deleted. 409 `name_taken` if the new name belongs to another file; 422 `blob_missing`,
        `hash_mismatch`, `media_missing`, or `kind_mismatch` (a video only takes a video, and so on); 507 `insufficient_storage`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MediaReplaceInput' }
      responses:
        '200':
          description: Replaced
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Media' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '507': { $ref: '#/components/responses/InsufficientStorage' }

  /v1/media/{mediaId}/usage:
    parameters:
      - { $ref: '#/components/parameters/OrganizationHeader' }
      - { $ref: '#/components/parameters/MediaId' }
    get:
      operationId: getMediaUsage
      tags: [media]
      description: Same access as `getMedia`. Every playlist using the file, by team, for the delete confirmation.
      responses:
        '200':
          description: Usage
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaUsage' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/playlists:
    parameters:
      - { $ref: '#/components/parameters/OrganizationHeader' }
    get:
      operationId: listPlaylists
      tags: [playlists]
      description: |
        `scope=mine` (default): playlists of the caller's teams (all teams for admins). `scope=visible`:
        also every other team's playlist that is available on a screen the caller reaches, read-only
        ("On my screens"). `team_id` narrows either scope to one team.
      parameters:
        - name: team_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: scope
          in: query
          required: false
          schema: { type: string, enum: [mine, visible], default: mine }
      responses:
        '200':
          description: Playlist summaries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PlaylistSummary' }
    post:
      operationId: createPlaylist
      tags: [playlists]
      description: Editor of the team. Every file must be in a folder the team reaches (422 `invalid_playlist`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlaylistInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Playlist' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/playlists/{playlistId}:
    parameters:
      - { $ref: '#/components/parameters/OrganizationHeader' }
      - { $ref: '#/components/parameters/PlaylistId' }
    get:
      operationId: getPlaylist
      tags: [playlists]
      description: Viewers of the owning team, and anyone who reaches a screen the playlist is available on (read-only).
      responses:
        '200':
          description: Full playlist
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Playlist' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updatePlaylist
      tags: [playlists]
      description: |
        Replace the playlist. `base_version` must equal the current version, else 409 with the
        current playlist in `Error.current`. On success version increments and assigned screens get
        `manifest_changed`. Item/bed IDs supplied by the client are preserved; missing IDs are generated.
        422 if media references are invalid, bed ranges overlap, or a bed references unknown items.
        Newly added files must be in folders the playlist's team reaches; files already in the playlist
        stay valid even if the team no longer reaches them or they are missing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlaylistUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Playlist' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    patch:
      operationId: movePlaylist
      tags: [playlists]
      description: Editor of the owning team. Moves the playlist to a folder of the same team (null = team root). Does not bump `version`. 422 `invalid_folder`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlaylistPatch' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Playlist' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      operationId: deletePlaylist
      tags: [playlists]
      description: Screens that used it as fallback fall back to the home menu; overrides showing it are cleared. Affected screens are notified.
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/playlists/{playlistId}/tags:
    parameters:
      - { $ref: '#/components/parameters/OrganizationHeader' }
      - { $ref: '#/components/parameters/PlaylistId' }
    put:
      operationId: putPlaylistTags
      tags: [playlists]
      description: |
        Editor of the owning team. Replaces the playlist's tags, separately from the `base_version`
        autosave (the version does not change). An editor may only use tags the team holds (any tag for
        a team with `screen_access: all`, or for admins); 422 `invalid_tag` otherwise. Screens that gain or
        lose the playlist get `manifest_changed`. Clashes the change causes between one-off entries are
        allowed and flagged, as for `putTeamTags`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TagIdsInput' }
      responses:
        '200':
          description: The playlist and any clashes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaylistChange' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/playlist-folders:
    parameters:
      - { $ref: '#/components/parameters/OrganizationHeader' }
    get:
      operationId: listPlaylistFolders
      tags: [playlists]
      description: Folders of the caller's teams (all for admins), or of one team with `team_id` (viewer role).
      parameters:
        - name: team_id
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Folders, by position then name
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PlaylistFolder' }
    post:
      operationId: createPlaylistFolder
      tags: [playlists]
      description: Editor of the team. `parent_id` must be a folder of the same team (422 `invalid_folder`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlaylistFolderInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaylistFolder' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/playlist-folders/{folderId}:
    parameters:
      - { $ref: '#/components/parameters/OrganizationHeader' }
      - { $ref: '#/components/parameters/FolderId' }
    patch:
      operationId: updatePlaylistFolder
      tags: [playlists]
      description: Editor of the team. Rename, reorder or move; a folder can't move into itself or a descendant (422 `invalid_folder`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlaylistFolderPatch' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaylistFolder' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      operationId: deletePlaylistFolder
      tags: [playlists]
      description: Editor of the team. Its folders and playlists move to its parent.
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/nodes:
    get:
      operationId: listNodes
      tags: [nodes]
      description: Any signed-in user. Every node in the org, with its reported outputs and the screens it plays.
      responses:
        '200':
          description: Nodes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Node' }

  /v1/nodes/{nodeId}:
    parameters:
      - { $ref: '#/components/parameters/NodeId' }
    get:
      operationId: getNode
      tags: [nodes]
      description: Any signed-in user.
      responses:
        '200':
          description: Node
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Node' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateNode
      tags: [nodes]
      description: |
        Server admin only: a node edit that touches no screen. Renames the node and/or changes its mode
        (as `putDeviceMode`: leaving player releases its screens, which become unplaced). The node gets
        `assignments_changed` on a mode change.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NodePatch' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Node' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/nodes/{nodeId}/assignments:
    parameters:
      - { $ref: '#/components/parameters/NodeId' }
    get:
      operationId: getNodeAssignments
      tags: [nodes]
      description: Any signed-in user. What each output of the node should do, with the version Studio compares against `Node.applied_assignments_version`.
      responses:
        '200':
          description: Assignments
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Assignments' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: putNodeAssignments
      tags: [nodes]
      description: |
        Full replace (`updated_by` is the user). This is how a node gets new targets. Each output whose
        job, screen or settings change needs the caller to operate every screen it targeted before and
        after (an admin, or an editor of a team that reaches the screen), else 403. A changed output
        that targets no screen before or after (for example a program job waiting for its screen) is
        admin only. Unchanged outputs need nothing. `base_version` must equal the current version, else
        409 `version_conflict` with the current `Assignments` in `Error.current`. The validation rules
        are those of `putDeviceAssignments` (without its `target_not_assigned` limit). The node gets
        `assignments_changed`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignmentsInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Assignments' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/screens/{screenId}/move:
    parameters:
      - { $ref: '#/components/parameters/ScreenId' }
    post:
      operationId: moveScreen
      tags: [screens]
      description: |
        Operate role on the screen (and on any screen the target output played). Makes `output_key` of
        `node_id` (any player node in the org that reports the output) the screen's only program output.
        Its previous program outputs become `off` and the settings of the first one (the audio one if
        any) move with it; a screen that was on the target output loses that output (unplaced if it was
        its last). Affected nodes get `assignments_changed`. 422: `unknown_node`,
        `job_not_allowed_in_mode`, `unknown_output`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MoveScreenInput' }
      responses:
        '200':
          description: The moved screen
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Screen' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/screens:
    parameters:
      - { $ref: '#/components/parameters/OrganizationHeader' }
    get:
      operationId: listScreens
      tags: [screens]
      description: |
        The screens the caller reaches (every screen for admins). `team_id` narrows it to the screens
        that team reaches. Includes unplaced screens (no `node_id`, because their program outputs were
        released), which keep their schedule and placement.
      parameters:
        - name: team_id
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Screens with live status
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Screen' }

  /v1/screens/{screenId}:
    parameters:
      - { $ref: '#/components/parameters/OrganizationHeader' }
      - { $ref: '#/components/parameters/ScreenId' }
    get:
      operationId: getScreen
      tags: [screens]
      responses:
        '200':
          description: Screen
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Screen' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateScreen
      tags: [screens]
      description: |
        Operate role. Rename, place on a floor plan, set the nothing-scheduled `fallback_playlist_id`
        (a playlist of a team the caller edits that is available on the screen, else 422
        `playlist_unavailable`; null = home menu), or set `timezone` (IANA, null = the org zone; 422
        `invalid_timezone`). Tags are set with `putScreenTags`. Each change is written to the activity
        log. The device gets `manifest_changed`; reaching users get `screen_updated` and `screen_activity`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScreenPatch' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Screen' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      operationId: deleteScreen
      tags: [screens]
      description: |
        Server admin only. Deletes the screen. Assignments that targeted it become off, and the node's reported
        outputs drop that screen. If the node has no screens left it is unpaired: the device token
        is revoked and its socket closed. A node that still has another screen keeps its token.
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/screens/{screenId}/command:
    parameters:
      - { $ref: '#/components/parameters/OrganizationHeader' }
      - { $ref: '#/components/parameters/ScreenId' }
    post:
      operationId: sendScreenCommand
      tags: [screens]
      description: |
        Remote-control a screen (operate role; logged to the activity log). 409 if the screen is offline. `jump` requires
        `item_index` (>= 0) and takes an optional `step_index` for sequence pages (400 otherwise).
        The node receives it on its socket with `screen_id` set.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScreenCommand' }
      responses:
        '202': { description: Delivered to the device socket }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/screens/{screenId}/override:
    parameters:
      - { $ref: '#/components/parameters/OrganizationHeader' }
      - { $ref: '#/components/parameters/ScreenId' }
    put:
      operationId: setScreenOverride
      tags: [screens]
      description: |
        Operate role. Plays a playlist (null = blank) on this screen above every schedule entry
        until `until`, the next scheduled change (`until_next_change`), or until cleared. The playlist
        must belong to a team the caller edits and be available on the screen (422
        `playlist_unavailable`). The last override wins. The device gets `manifest_changed`; reaching
        users get `screen_updated` and `screen_activity`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScreenOverrideInput' }
      responses:
        '200':
          description: Updated screen
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Screen' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      operationId: clearScreenOverride
      tags: [screens]
      description: Operate role. Returns the screen to its schedule. Any reaching editor may clear any override.
      responses:
        '200':
          description: Updated screen
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Screen' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/screens/{screenId}/tags:
    parameters:
      - { $ref: '#/components/parameters/OrganizationHeader' }
      - { $ref: '#/components/parameters/ScreenId' }
    put:
      operationId: putScreenTags
      tags: [screens]
      description: |
        Server admin only. Replaces the screen's tags, which decide which teams reach it and which
        playlists it caches. `warnings` flags a fallback or override that is no longer available
        (`fallback_unavailable` plays the home menu instead; `override_unavailable` is skipped).
        Clashes between one-off entries are allowed and flagged as for `putTeamTags`. An untagged
        screen plays nothing and gets an `untagged_screen` notice (to admins). Logged to the activity log.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TagIdsInput' }
      responses:
        '200':
          description: The screen, clashes and warnings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScreenChange' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/screens/{screenId}/events:
    parameters:
      - { $ref: '#/components/parameters/OrganizationHeader' }
      - { $ref: '#/components/parameters/ScreenId' }
    get:
      operationId: listScreenEvents
      tags: [screens]
      description: Viewer of a reaching team. The screen's activity log, newest first.
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        '200':
          description: Events
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ScreenEvent' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/screens/overrides:
    parameters:
      - { $ref: '#/components/parameters/OrganizationHeader' }
    post:
      operationId: setScreenOverrides
      tags: [screens]
      description: |
        Sets (or with `clear: true` clears) overrides on many screens: those in `screen_ids` plus those
        carrying any of `tag_ids`. Every named screen must be one the caller operates (403 otherwise);
        screens matched by tag that the caller doesn't operate are left out. The playlist must belong to
        a team the caller edits; screens it isn't available on are skipped with an
        `override_unavailable` warning. 422 `no_screens` when nothing matches.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BulkOverrideInput' }
      responses:
        '200':
          description: The screens changed, and warnings for those skipped
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkOverrideResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/schedule:
    parameters:
      - { $ref: '#/components/parameters/OrganizationHeader' }
    get:
      operationId: listSchedule
      tags: [schedule]
      description: |
        Schedule entries plus the org timezone. `scope=mine` (default): entries of the caller's teams
        (or of `team_id`, viewer role). `scope=visible`: also other teams' entries that apply to a screen
        the caller reaches, read-only.
      parameters:
        - name: team_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: scope
          in: query
          required: false
          schema: { type: string, enum: [mine, visible], default: mine }
      responses:
        '200':
          description: Entries
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduleList' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createScheduleEntry
      tags: [schedule]
      description: |
        Editor role in `team_id`. `playlist_id` must be the team's; `screen_ids` must be screens the team
        reaches and `tag_ids` tags the team holds (422 `invalid_schedule`). A one-off entry that would
        play at the same time as another enabled one-off entry (of any team) on some screen is refused
        with 409 `schedule_conflict`, listing the clashes in `Error.conflicts`. Affected devices get
        `manifest_changed`; user sockets get `schedule_changed`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleEntryInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduleEntry' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/schedule/preview:
    parameters:
      - { $ref: '#/components/parameters/OrganizationHeader' }
    post:
      operationId: previewScheduleEntry
      tags: [schedule]
      description: |
        Editor role in `team_id`. Validates an entry as `createScheduleEntry` would and, without saving,
        reports for each screen it applies to: the ranges it wins, the ranges another entry covers it,
        the entries it covers, and any blocking one-off clash. Weekly entries are previewed for the next
        14 days, one-off entries over their own range (at most 14 days). `entry_id` names the entry being
        edited, so it is left out of the comparison. Overrides are ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SchedulePreviewInput' }
      responses:
        '200':
          description: Preview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SchedulePreview' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/schedule/{entryId}:
    parameters:
      - { $ref: '#/components/parameters/OrganizationHeader' }
      - { $ref: '#/components/parameters/EntryId' }
    put:
      operationId: updateScheduleEntry
      tags: [schedule]
      description: Editor role. Replaces the entry (`team_id` must not change). Same rules and 409 `schedule_conflict` as `createScheduleEntry`; saving a flagged entry without a clash clears `needs_resolution`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleEntryInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduleEntry' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      operationId: deleteScheduleEntry
      tags: [schedule]
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/schedule/timeline:
    parameters:
      - { $ref: '#/components/parameters/OrganizationHeader' }
    get:
      operationId: getScheduleTimeline
      tags: [schedule]
      description: |
        What each screen the caller reaches (or that `team_id` reaches, viewer role) plays between
        `from` and `to` (at most 14 days), resolved across every team: override > once > weekly >
        nothing-scheduled (the fallback playlist, else the home menu). Within a tier: screen match > tag
        match > team-wide, then the newest entry. Entries whose playlist isn't available on the screen
        are skipped. Segments are contiguous and cover the whole range.
      parameters:
        - name: team_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Timeline
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduleTimeline' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/floor-plans:
    parameters:
      - { $ref: '#/components/parameters/OrganizationHeader' }
    get:
      operationId: listFloorPlans
      tags: [floor-plans]
      description: Any signed-in user. Floor plans belong to the org.
      responses:
        '200':
          description: Floor plans in display order
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FloorPlan' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createFloorPlan
      tags: [floor-plans]
      description: Server admin only. Upload the image with `PUT /v1/blobs/{sha256}` first. User sockets get `floor_plans_changed`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FloorPlanInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FloorPlan' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/floor-plans/{floorPlanId}:
    parameters:
      - { $ref: '#/components/parameters/OrganizationHeader' }
      - { $ref: '#/components/parameters/FloorPlanId' }
    put:
      operationId: updateFloorPlan
      tags: [floor-plans]
      description: Server admin only. User sockets get `floor_plans_changed`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FloorPlanInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FloorPlan' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      operationId: deleteFloorPlan
      tags: [floor-plans]
      description: Server admin only. Screens placed on it lose their placement. User sockets get `floor_plans_changed`.
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/pairing:
    post:
      operationId: startPairing
      tags: [pairing]
      security: []
      description: |
        Called by an unpaired device. Code expires after 10 minutes. The body is optional: absent or
        `kind: single` pairs a single-screen device (claiming creates the node and one screen);
        `kind: node` pairs a multi-output node (claiming creates only the node). With `kind: node`,
        `mode` (player, controller or stage; default player) is the device's mode; `mode` with
        `kind: single` other than player is 400.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PairingStartInput' }
      responses:
        '201':
          description: Pairing session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PairingSession' }

  /v1/pairing/claim:
    parameters:
      - { $ref: '#/components/parameters/OrganizationHeader' }
    post:
      operationId: claimPairing
      tags: [pairing]
      description: |
        Server admin or an editor of any team. Creates the node (nodes have no team). For a `single`
        pairing it also creates the node's one Screen (program output `main`) with `tag_ids` and returns
        that Screen. An editor must give it at least one tag a team they edit holds, and only such tags,
        so it lands in their reach (422 `tag_required` / `invalid_tag`); an admin may leave it untagged.
        `playlist_id` sets the fallback and follows `updateScreen`'s rule. For a `node` pairing it returns
        the Node (no screens yet; the node creates untagged screens with `createDeviceScreen`);
        `tag_ids` and `playlist_id` are 400 there.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PairingClaim' }
      responses:
        '201':
          description: Screen (single pairing) or Node (node pairing)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Screen'
                  - $ref: '#/components/schemas/Node'
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/pairing/{pairingId}:
    parameters:
      - name: pairingId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: secret
        in: query
        required: true
        schema: { type: string }
    get:
      operationId: pollPairing
      tags: [pairing]
      security: []
      description: Device polls (~2 s). `device_token` is returned once, on the first poll after claim.
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PairingStatus' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/device/manifest:
    get:
      operationId: getDeviceManifest
      tags: [device]
      description: |
        Device token only. Covers the next 48 hours: `timeline` says what to play when, `playlists`
        holds every playlist it references, and `media`/`assets` cover all of them so the device can
        switch on schedule while offline. The ETag changes when the active playlist, a scheduled
        boundary, or a referenced playlist version changes; honors `If-None-Match` with 304.
        `screen_id` selects the screen; it may be omitted when the node has exactly one screen
        (422 `screen_id_required` otherwise). A screen that is not the node's is 404, unless the node has a
        control or confidence assignment for it (read-only access, so a remote controller can show
        thumbnails). Blobs are readable by any authenticated principal.
      parameters:
        - { $ref: '#/components/parameters/DeviceScreenIdQuery' }
        - name: If-None-Match
          in: header
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Manifest
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Manifest' }
        '304': { description: Not modified }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/device/playlists:
    get:
      operationId: listDevicePlaylists
      tags: [device]
      description: |
        Device token only. The screen's picker tree (the same as `Manifest.picker`), for choosing on the
        device. `screen_id` as for `getDeviceManifest`, except that only screens the node plays or holds
        a control assignment on are allowed (confidence-only is 403).
      parameters:
        - { $ref: '#/components/parameters/DeviceScreenIdQuery' }
      responses:
        '200':
          description: Playlist summaries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PickerNode' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/device/playlist:
    put:
      operationId: selectDevicePlaylist
      tags: [device]
      description: |
        Device token only. Picks a playlist available on the screen (null = home menu; 422
        `playlist_unavailable` otherwise). If the screen has a schedule in the next 14 days this is an
        override until the next scheduled change; otherwise it sets the screen's fallback. Logged to the
        activity log with the node as the actor. The device gets `manifest_changed`; reaching users get
        `screen_updated`.
        This is the same whether chosen on a Control output or with a remote. `screen_id` in the body
        may be omitted when the node has exactly one screen. It may also name a screen the node holds a control assignment on (a remote choice, same override semantics); a confidence-only target is 403 and any other screen is 404.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DevicePlaylistSelection' }
      responses:
        '204': { description: Assigned }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/device/node:
    get:
      operationId: getDeviceNode
      tags: [device]
      description: Device token only. The calling node and every screen it plays.
      responses:
        '200':
          description: Node and its screens
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceNode' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/device/outputs:
    put:
      operationId: putDeviceOutputs
      tags: [device]
      description: |
        Device token only. Replaces the node's reported output map (the node is authoritative).
        Never deletes screens: a screen whose output disappears stays in Studio. Output keys must be
        unique and any `screen_id` must be one of the node's screens (422 `invalid_outputs`).
        User sockets in the team get `node_updated`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/Output' }
      responses:
        '200':
          description: The updated node
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Node' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/device/screens:
    post:
      operationId: createDeviceScreen
      tags: [device]
      description: |
        Device token only, player mode. Creates a new untagged screen on one of the node's reported
        outputs (as its program output), with no Studio approval. It grants nothing and plays nothing
        until an admin tags it; admins get an `untagged_screen` notice. 422 `unknown_output` if
        `output_key` is not in the node's outputs; 409 `output_has_screen` if that output already plays
        a screen. The matching output's `screen_id` is filled in. Admins get `screen_updated` and
        everyone gets `node_updated`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceScreenInput' }
      responses:
        '201':
          description: Screen created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Screen' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/device/assignments:
    get:
      operationId: getDeviceAssignments
      tags: [device]
      description: Device token only. The server's desired assignments for this node, its mode and the version.
      responses:
        '200':
          description: Assignments
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Assignments' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      operationId: putDeviceAssignments
      tags: [device]
      description: |
        Device token only. Full replace of the node's assignments; omitted outputs lose their job. The
        device's own change counts as applied (`applied_assignments_version` follows). A change made on
        the device can only rearrange the screens the node is already assigned to (any job): move them
        between its outputs, swap them, change their settings, or turn outputs off. Any other
        `screen_id` is 403 `target_not_assigned`; new targets come from Studio (`putNodeAssignments`),
        and new screens from `createDeviceScreen`. 409 `version_conflict` (current `Assignments` in
        `Error.current`) when `base_version` is stale. 422 codes: `job_not_allowed_in_mode` (controller and
        stage: only control, confidence, off), `screen_must_be_local` (program job for a screen whose
        program outputs are on another node), `control_needs_input` (output kind decklink or virtual),
        `unknown_screen`, `unknown_output` (output not in the reported outputs; allowed only for job
        `off`), `screen_required` (control and confidence need `screen_id`), `audio_conflict` (one
        audio-enabled assignment per screen across the org), `invalid_assignments`. A program job without
        `screen_id` is stored as is and the screen is created with `createDeviceScreen`. Removing a
        screen's last program job unplaces the screen (it is never deleted).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignmentsInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Assignments' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/device/mode:
    put:
      operationId: putDeviceMode
      tags: [device]
      description: |
        Device token only. Changes what the device is for. Leaving player releases the node's screens
        (they become unplaced, keeping schedule and placement) and drops its program assignments.
        Bumps the assignments version. Returns the new `Assignments`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceModeInput' }
      responses:
        '200':
          description: Assignments after the change
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Assignments' }
        '400': { description: Unknown mode, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/device/screens/{screenId}/command:
    parameters:
      - { $ref: '#/components/parameters/ScreenId' }
    post:
      operationId: sendDeviceScreenCommand
      tags: [device]
      description: |
        Device token only. Remote control of a screen played by another node, with the same body and
        errors as `sendScreenCommand`. 403 unless this node has a `control` assignment targeting the screen.
        409 `screen_offline` if the player is offline.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScreenCommand' }
      responses:
        '202': { description: Delivered to the player's socket }
        '400': { $ref: '#/components/responses/Unprocessable' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/notices:
    parameters:
      - { $ref: '#/components/parameters/OrganizationHeader' }
    get:
      operationId: listNotices
      tags: [notices]
      description: |
        The caller's notices (admins also get notices addressed to every admin), newest first. By
        default only open ones (not resolved, not dismissed); `all=true` includes the rest. A notice
        resolves itself when its cause goes away (a clash is fixed, a screen gets a tag).
      parameters:
        - name: all
          in: query
          required: false
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Notices
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Notice' }

  /v1/notices/{noticeId}/dismiss:
    parameters:
      - { $ref: '#/components/parameters/OrganizationHeader' }
      - { $ref: '#/components/parameters/NoticeId' }
    post:
      operationId: dismissNotice
      tags: [notices]
      description: Hides the notice. A notice addressed to every admin is dismissed for all of them.
      responses:
        '204': { description: Dismissed }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/ws:
    parameters:
      - { $ref: '#/components/parameters/OrganizationHeader' }
    get:
      operationId: openSocket
      tags: [device]
      description: |
        WebSocket upgrade. Devices and users. Text frames carry `WsServerMessage` (server→client) and
        `WsClientMessage` (client→server). Server pings every 20 s; clients reconnect with backoff
        (1 s doubling, max 30 s) and refetch the manifests on reconnect. A device socket belongs to a
        node and serves all of its screens, so device-facing messages carry `screen_id`; the server
        announces `screen_online`/`screen_offline` for each screen of the node.
      parameters:
        - { $ref: '#/components/parameters/TokenQuery' }
      responses:
        '101': { description: Switching protocols }
        '401': { $ref: '#/components/responses/Unauthorized' }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer

  parameters:
    OrganizationHeader:
      name: X-Organization
      in: header
      required: false
      description: |
        The org this request is for. Optional on a self-hosted server; if present it must match,
        else `404 organization_not_found`. A hosting gateway requires it and routes by it.
      schema: { type: string }
    InviteId:
      name: inviteId
      in: path
      required: true
      schema: { type: string }
    TeamId:
      name: teamId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MediaId:
      name: mediaId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UploadId:
      name: uploadId
      in: path
      required: true
      schema: { type: string, format: uuid }
    LibraryId:
      name: libraryId
      in: path
      required: true
      schema: { type: string }
    PlaylistId:
      name: playlistId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EntryId:
      name: entryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    FloorPlanId:
      name: floorPlanId
      in: path
      required: true
      schema: { type: string, format: uuid }
    NodeId:
      name: nodeId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TagId:
      name: tagId
      in: path
      required: true
      schema: { type: string, format: uuid }
    FolderId:
      name: folderId
      in: path
      required: true
      schema: { type: string, format: uuid }
    NoticeId:
      name: noticeId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DeviceScreenIdQuery:
      name: screen_id
      in: query
      required: false
      description: Which of the node's screens. Optional when the node has exactly one screen.
      schema: { type: string, format: uuid }
    ScreenId:
      name: screenId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Sha256:
      name: sha256
      in: path
      required: true
      schema: { type: string, pattern: '^[0-9a-f]{64}$' }
    TokenQuery:
      name: token
      in: query
      required: false
      description: Alternative to the Authorization header.
      schema: { type: string }

  responses:
    BadRequest:
      description: Malformed request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Insufficient role
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: 'Not found (or not visible to caller). Code `organization_not_found` when `X-Organization` does not match.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Version or state conflict
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unprocessable:
      description: Semantically invalid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PayloadTooLarge:
      description: Too large for the library (code `file_too_large`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InsufficientStorage:
      description: 'Not enough space in the library (code `insufficient_storage`; `free_bytes` says how much is left)'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            Stable machine code. Clients word their own messages from `code`, `reason` and `params`;
            `message` is English for logs and API users. Codes and the reasons each can carry:
            - `audio_conflict`: `one_output`, `other_device`
            - `bad_request`: `claim_value_empty`, `claim_value_repeated`, `folder_mismatch`, `image_size_invalid`, `invalid_body`, `invalid_query`, `item_index_invalid`, `kind_invalid`, `mime_required`, `name_empty`, `name_invalid`, `org_name_empty`, `part_batch_invalid`, `part_number_invalid`, `part_size_invalid`, `path_only_local`, `placement_invalid`, `quota_negative`, `s3_bucket_invalid`, `s3_endpoint_invalid`, `s3_only_s3`, `s3_settings_incomplete`, `scope_invalid`, `screen_access_invalid`, `sha256_invalid`, `single_screen_only`, `size_negative`, `step_index_invalid`, `timeline_range_invalid`, `upload_interrupted`
            - `blob_missing`: `file`, `image`, `thumbnail`
            - `control_needs_input`
            - `file_too_large`
            - `forbidden`
            - `hash_mismatch`: `joined`, `object`, `upload`
            - `insufficient_storage`
            - `internal`
            - `invalid_assignments`: `clock_invalid`, `output_key_empty`, `output_repeated`
            - `invalid_floor_plan`
            - `invalid_folder`: `folder_unknown`, `move_into_self`, `move_invalid`, `parent_other_library`, `parent_unknown`
            - `invalid_outputs`: `output_empty`, `output_repeated`
            - `invalid_override`
            - `invalid_playlist`: `bed_end_unknown`, `bed_needs_track`, `bed_reversed`, `bed_start_unknown`, `bed_volume`, `beds_overlap`, `item_has_pages`, `item_needs_media`, `item_needs_pages`, `item_repeated`, `item_transition_too_long`, `item_volume`, `media_kind`, `media_unreachable`, `playlist_unknown`, `transition_too_long`
            - `invalid_schedule`: `date_invalid`, `datetime_invalid`, `days_invalid`, `end_before_start`, `entry_unknown`, `range_reversed`, `screens_unreachable`, `tags_not_held`, `tags_unknown`, `team_locked`, `time_invalid`
            - `invalid_tag`: `tag_not_editable`, `tag_not_held`, `tag_unknown`
            - `invalid_timezone`
            - `job_not_allowed_in_mode`: `mode_jobs`, `screens_need_player`
            - `kind_mismatch`
            - `library_managed`
            - `library_not_empty`: `bucket_locked`, `has_folders`, `path_locked`
            - `media_missing`
            - `name_taken`: `file`, `folder`
            - `no_screens`
            - `not_found`
            - `not_supported`: `single_organization`
            - `organization_not_found`
            - `output_has_screen`
            - `pairing_not_found`
            - `path_not_allowed`: `path_not_absolute`, `path_outside_roots`
            - `playlist_unavailable`: `not_on_screen`, `not_team_playlist`
            - `schedule_conflict`
            - `screen_id_required`
            - `screen_must_be_local`
            - `screen_offline`
            - `screen_required`
            - `setting_locked`: `org_name`, `timezone`
            - `storage_unreachable`: `probe_failed`, `s3`
            - `tag_exists`
            - `tag_not_held`
            - `tag_required`
            - `target_not_assigned`
            - `team_not_empty`
            - `unauthorized`
            - `unknown_node`
            - `unknown_output`
            - `unknown_screen`
            - `unknown_tag`
            - `unknown_team`
            - `upload_incomplete`: `not_joined`, `part_unsigned`, `s3_refused`
            - `version_conflict`: `assignments`, `playlist`
        reason:
          type: string
          description: Finer cause within `code` (listed under `code`). Absent when the code has one cause.
        params:
          type: object
          additionalProperties: true
          description: |
            Values the message refers to, by reason: `item`/`bed` (0-based index), `item_id`, `media`,
            `kind`/`expected` (media kinds), `tag`, `team`, `output`, `mode`, `claim_value`, `part`,
            `part_count`, `free_bytes` (on `insufficient_storage`), `detail` (raw storage or S3 text).
        message: { type: string, description: English description for logs; not for display. }
        free_bytes: { type: integer, format: int64, description: 'Present on `insufficient_storage`.' }
        current:
          description: |
            Present on `version_conflict`. A playlist conflict returns the current Playlist.
            An assignment conflict returns the current Assignments.
          oneOf:
            - { $ref: '#/components/schemas/Playlist' }
            - { $ref: '#/components/schemas/Assignments' }
        conflicts:
          type: array
          description: Present on `schedule_conflict`. The one-off entries the saved entry would clash with.
          items: { $ref: '#/components/schemas/ScheduleClash' }

    ServerInfo:
      type: object
      required: [name, slug, version, api_version, server_id]
      properties:
        name: { type: string, description: Product display name from branding }
        slug: { type: string }
        version: { type: string }
        api_version: { type: integer, description: Major API version (1) }
        server_id: { type: string, format: uuid, description: Stable per-installation ID }
        oidc_enabled: { type: boolean }
        public_url: { type: string, description: 'Externally reachable base URL, when configured (`<SLUG>_PUBLIC_URL`)' }

    AuthConfig:
      type: object
      required: [oidc_enabled]
      properties:
        oidc_enabled: { type: boolean }
        issuer: { type: string }
        client_id: { type: string }
        scopes:
          type: array
          items: { type: string }
        token_type:
          type: string
          enum: [access_token, id_token]
          description: Which token the client must send as Bearer.

    Role:
      type: string
      enum: [viewer, editor, admin]

    OrganizationRole:
      type: string
      enum: [admin, member]
      description: '`admin` = server admin (`admin_groups` or the bootstrap token).'

    Organization:
      type: object
      required: [id, name, team_count, role]
      properties:
        id: { type: string, description: 'Org id to send as `X-Organization`. Self-hosted: the server_id.' }
        name: { type: string }
        team_count: { type: integer, description: Teams the caller belongs to in this org (all teams for admins) }
        role: { $ref: '#/components/schemas/OrganizationRole' }

    Invite:
      type: object
      required: [id, organization_name, role]
      properties:
        id: { type: string }
        organization_name: { type: string }
        role: { $ref: '#/components/schemas/OrganizationRole' }

    OrganizationList:
      type: object
      required: [organizations, can_create, invites]
      properties:
        organizations:
          type: array
          items: { $ref: '#/components/schemas/Organization' }
        can_create: { type: boolean, description: Whether `POST /v1/organizations` is offered (always false self-hosted) }
        invites:
          type: array
          description: Pending invites (always empty self-hosted)
          items: { $ref: '#/components/schemas/Invite' }

    OrganizationInput:
      type: object
      required: [name, timezone, first_team_name]
      properties:
        name: { type: string, minLength: 1 }
        timezone: { type: string, description: IANA zone }
        first_team_name: { type: string, minLength: 1 }

    SettingName:
      type: string
      enum: [org_name, timezone]

    Settings:
      type: object
      required: [organization_id, org_name, timezone, locked, configured]
      properties:
        organization_id: { type: string, description: Same as `server_id` }
        org_name: { type: string, description: 'Org display name; defaults to the product name until set' }
        timezone: { type: string, description: 'Org IANA zone for every schedule; defaults to the host zone, else UTC' }
        locked:
          type: array
          description: Settings fixed by env vars (`<SLUG>_ORG_NAME`, `<SLUG>_ORG_TIMEZONE`); PATCH rejects them
          items: { $ref: '#/components/schemas/SettingName' }
        configured: { type: boolean, description: 'False until the org name has been set (by env var or PATCH): drives first-run setup' }

    SettingsPatch:
      type: object
      properties:
        org_name: { type: string, minLength: 1 }
        timezone: { type: string, description: IANA zone }

    Me:
      type: object
      required: [kind, subject, server_admin, memberships]
      properties:
        kind:
          type: string
          enum: [user, bootstrap, device]
        subject: { type: string }
        display_name: { type: string }
        email: { type: string }
        server_admin: { type: boolean }
        memberships:
          type: array
          items: { $ref: '#/components/schemas/Membership' }
        node_id: { type: string, format: uuid, description: Set for device principals }
        screen_id: { type: string, format: uuid, description: Set for device principals whose node has exactly one screen }
        timezone: { type: [string, 'null'], description: 'Display zone (IANA); null = the org zone. Users only.' }

    MePatch:
      type: object
      properties:
        timezone: { type: [string, 'null'], description: IANA zone; null = the org zone }

    Membership:
      type: object
      required: [team_id, role]
      properties:
        team_id: { type: string, format: uuid }
        team_name: { type: string }
        role: { $ref: '#/components/schemas/Role' }

    OidcBinding:
      type: object
      required: [claim_value, role]
      properties:
        claim_value: { type: string, description: Value that must appear in the IdP groups claim }
        role: { $ref: '#/components/schemas/Role' }

    TeamInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        oidc_bindings:
          type: array
          description: |
            Sign-in groups (IdP `groups` claim values) and the team role each grants. Lets a server
            admin create the first team and map their sign-in groups to it in one call. Each
            `claim_value` must be non-empty and appear at most once.
          items: { $ref: '#/components/schemas/OidcBinding' }

    ScreenAccess:
      type: string
      enum: [all, tags]
      description: '`all` reaches every screen; `tags` (default) reaches screens carrying one of the team''s tags.'

    Team:
      type: object
      required: [id, name, oidc_bindings, screen_access, tag_ids, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        oidc_bindings:
          type: array
          items: { $ref: '#/components/schemas/OidcBinding' }
        screen_access: { $ref: '#/components/schemas/ScreenAccess' }
        tag_ids:
          type: array
          description: Tags the team holds
          items: { type: string, format: uuid }
        created_at: { type: string, format: date-time }

    TeamTagsInput:
      type: object
      required: [tag_ids]
      properties:
        tag_ids:
          type: array
          items: { type: string, format: uuid }
        screen_access: { $ref: '#/components/schemas/ScreenAccess' }

    TeamChange:
      type: object
      required: [team, clashes, warnings]
      properties:
        team: { $ref: '#/components/schemas/Team' }
        clashes:
          type: array
          items: { $ref: '#/components/schemas/ScheduleClash' }
        warnings:
          type: array
          items: { $ref: '#/components/schemas/ChangeWarning' }

    TeamReach:
      type: object
      required: [teams]
      properties:
        teams:
          type: array
          items:
            type: object
            required: [team_id, team_name, screen_access, tag_ids, screen_ids]
            properties:
              team_id: { type: string, format: uuid }
              team_name: { type: string }
              screen_access: { $ref: '#/components/schemas/ScreenAccess' }
              tag_ids:
                type: array
                items: { type: string, format: uuid }
              screen_ids:
                type: array
                description: Screens the team reaches
                items: { type: string, format: uuid }

    Tag:
      type: object
      required: [id, name, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, description: Unique ignoring case }
        color: { type: string, description: 'Display color, e.g. #FF9500' }
        created_at: { type: string, format: date-time }

    TagInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        color: { type: [string, 'null'] }

    TagPatch:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        color: { type: [string, 'null'] }

    TagUsage:
      type: object
      required: [screen_ids, team_ids, playlist_ids, entry_ids]
      properties:
        screen_ids: { type: array, items: { type: string, format: uuid } }
        team_ids: { type: array, items: { type: string, format: uuid } }
        playlist_ids: { type: array, items: { type: string, format: uuid } }
        entry_ids: { type: array, description: Schedule entries targeting the tag, items: { type: string, format: uuid } }

    TagIdsInput:
      type: object
      required: [tag_ids]
      properties:
        tag_ids:
          type: array
          items: { type: string, format: uuid }

    ScheduleClash:
      type: object
      description: Two one-off entries that would both play on a screen over the same time.
      required: [entry_ids, screen_id, starts_at, ends_at]
      properties:
        entry_ids:
          type: array
          minItems: 2
          maxItems: 2
          description: Older entry first
          items: { type: string, format: uuid }
        screen_id: { type: string, format: uuid }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }

    ChangeWarningCode:
      type: string
      enum: [fallback_unavailable, override_unavailable]

    ChangeWarning:
      type: object
      required: [code, message]
      properties:
        code: { $ref: '#/components/schemas/ChangeWarningCode' }
        message: { type: string }
        screen_id: { type: string, format: uuid }
        playlist_id: { type: string, format: uuid }

    ChangeResult:
      type: object
      required: [clashes, warnings]
      properties:
        clashes:
          type: array
          description: One-off clashes this change newly caused (allowed and flagged)
          items: { $ref: '#/components/schemas/ScheduleClash' }
        warnings:
          type: array
          items: { $ref: '#/components/schemas/ChangeWarning' }

    BlobInfo:
      type: object
      required: [sha256, size]
      properties:
        sha256: { type: string }
        size: { type: integer, format: int64 }

    MediaKind:
      type: string
      enum: [video, image, audio]

    MediaInput:
      type: object
      required: [folder_id, name, kind, sha256, mime]
      properties:
        folder_id: { type: string, format: uuid }
        name: { type: string, description: 'File name in the folder, e.g. "Welcome loop.mov"' }
        kind: { $ref: '#/components/schemas/MediaKind' }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        mime: { type: string, examples: [video/mp4, video/quicktime, image/jpeg, image/png, image/heic, audio/mp4] }
        width: { type: integer }
        height: { type: integer }
        duration_ms: { type: integer, format: int64, description: Video/audio only }
        codec: { type: string, description: e.g. hvc1, avc1, aac, alac }
        hdr: { type: boolean }
        frame_rate: { type: number }
        source_filename: { type: string, description: The original file name before transcoding }
        source_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: SHA-256 of the original file before transcoding. Omit when it passed through unchanged (it defaults to `sha256`).
        thumbnail_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Optional JPEG thumbnail uploaded with `putBlob`; it stays in the managed store

    MediaPatch:
      type: object
      properties:
        name: { type: string }
        folder_id: { type: string, format: uuid, description: Move to this folder (any library) }

    MediaAccess:
      type: string
      description: |
        What the caller can do with a file. `edit`: an editor team reaches its folder. `view`: a team
        reaches its folder. `playlist`: only used by one of the caller's teams' playlists (it stays there
        read-only, flagged in Studio).
      enum: [edit, view, playlist]

    Media:
      type: object
      required: [id, library_id, name, path, kind, sha256, mime, size, missing, access, created_at]
      properties:
        id: { type: string, format: uuid }
        library_id: { type: string }
        folder_id: { type: string, format: uuid, description: Absent once the file is missing }
        name: { type: string }
        path: { type: string, description: 'Path in the library, e.g. "Lobby/Loops/Welcome loop.mov"' }
        kind: { $ref: '#/components/schemas/MediaKind' }
        sha256: { type: string }
        mime: { type: string }
        width: { type: integer }
        height: { type: integer }
        duration_ms: { type: integer, format: int64 }
        codec: { type: string }
        hdr: { type: boolean }
        frame_rate: { type: number }
        source_filename: { type: string }
        source_sha256: { type: string, description: SHA-256 of the original file before transcoding }
        thumbnail_sha256: { type: string }
        size: { type: integer, format: int64 }
        missing: { type: boolean, description: The file was deleted but playlists still use it }
        missing_at: { type: string, format: date-time }
        access: { $ref: '#/components/schemas/MediaAccess' }
        created_by: { type: string }
        created_at: { type: string, format: date-time }

    MediaUploadInput:
      type: object
      required: [folder_id, name, sha256, size, mime]
      properties:
        folder_id: { type: string, format: uuid }
        name: { type: string }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        size: { type: integer, format: int64 }
        mime: { type: string }
        replaces:
          type: string
          format: uuid
          description: |
            The file these bytes will replace (`replaceMedia`). `folder_id` must be its folder and `name`
            may be its own name. S3 bytes go to a staging key until the replace finishes.

    MediaReplaceInput:
      type: object
      required: [name, kind, sha256, mime]
      description: Like `MediaInput` without `folder_id`; every metadata field is replaced, absent ones cleared
      properties:
        name: { type: string, description: The file's name after the replace; may differ from the old one (e.g. a new extension) }
        kind: { $ref: '#/components/schemas/MediaKind' }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        mime: { type: string }
        width: { type: integer }
        height: { type: integer }
        duration_ms: { type: integer, format: int64 }
        codec: { type: string }
        hdr: { type: boolean }
        frame_rate: { type: number }
        source_filename: { type: string }
        source_sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        thumbnail_sha256: { type: string, pattern: '^[0-9a-f]{64}$' }

    MediaUpload:
      type: object
      required: [already_present]
      description: Either `method`, `url` and `headers` for one PUT, or `multipart`
      properties:
        already_present: { type: boolean, description: The bytes are already stored; skip the upload }
        method: { type: string, enum: [PUT] }
        url: { type: string, description: 'Absolute (S3) or relative to the server (`/v1/blobs/<sha256>`, send the usual Authorization)' }
        headers:
          type: object
          additionalProperties: { type: string }
          description: Headers to send with the upload (S3 signs them)
        expires_at: { type: string, format: date-time, description: S3 only }
        multipart: { $ref: '#/components/schemas/MultipartUpload' }

    MultipartUpload:
      type: object
      required: [upload_id, part_size, part_count]
      properties:
        upload_id: { type: string, format: uuid }
        part_size: { type: integer, format: int64, description: Bytes in every part but the last }
        part_count: { type: integer }

    MediaUploadPartsInput:
      type: object
      required: [parts]
      properties:
        parts:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [number, sha256]
            properties:
              number: { type: integer, minimum: 1 }
              sha256: { type: string, pattern: '^[0-9a-f]{64}$', description: SHA-256 of this part's bytes }

    MediaUploadPart:
      type: object
      required: [number, method, url, headers, expires_at]
      properties:
        number: { type: integer }
        method: { type: string, enum: [PUT] }
        url: { type: string }
        headers:
          type: object
          additionalProperties: { type: string }
        expires_at: { type: string, format: date-time }

    MediaUploadCompleteInput:
      type: object
      required: [parts]
      properties:
        parts:
          type: array
          description: Every part, each with the ETag S3 returned for its PUT
          items:
            type: object
            required: [number, etag]
            properties:
              number: { type: integer, minimum: 1 }
              etag: { type: string }

    MediaUsagePlaylist:
      type: object
      required: [id, name, team_id, team_name, items, member]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        team_id: { type: string, format: uuid }
        team_name: { type: string }
        items: { type: integer, description: How many of its items and bed tracks use the file(s) }
        member: { type: boolean, description: The caller is in this team (otherwise only the name and team are shown) }

    MediaUsage:
      type: object
      required: [playlists, media_count]
      properties:
        media_count: { type: integer, description: Files covered (1 for a file; every file under a folder) }
        playlists:
          type: array
          description: By team name, then playlist name
          items: { $ref: '#/components/schemas/MediaUsagePlaylist' }

    FolderAccess:
      type: string
      description: '`edit`: an editor team of the caller reaches it. `view`: a team reaches it. `none`: listed only as an ancestor.'
      enum: [edit, view, none]

    MediaFolder:
      type: object
      required: [id, library_id, name, path, tag_ids, team_ids, inherited_tag_ids, inherited_team_ids, access, created_at]
      properties:
        id: { type: string, format: uuid }
        library_id: { type: string }
        parent_id: { type: string, format: uuid, description: Absent for a top-level folder }
        name: { type: string }
        path: { type: string, description: 'e.g. "Lobby/Loops"' }
        tag_ids:
          type: array
          description: Tags set on this folder
          items: { type: string, format: uuid }
        team_ids:
          type: array
          description: Teams granted this folder directly
          items: { type: string, format: uuid }
        inherited_tag_ids:
          type: array
          description: Tags from ancestors
          items: { type: string, format: uuid }
        inherited_team_ids:
          type: array
          description: Grants from ancestors
          items: { type: string, format: uuid }
        access: { $ref: '#/components/schemas/FolderAccess' }
        created_at: { type: string, format: date-time }

    MediaFolderInput:
      type: object
      required: [library_id, name]
      properties:
        library_id: { type: string }
        parent_id: { type: string, format: uuid }
        name: { type: string }

    MediaFolderPatch:
      type: object
      properties:
        name: { type: string }
        parent_id: { type: string, format: uuid, description: New parent in the same library }

    MediaFolderGrantsInput:
      type: object
      required: [team_ids]
      properties:
        team_ids:
          type: array
          items: { type: string, format: uuid }

    LibraryKind:
      type: string
      description: '`managed`: the server''s own store under its data directory. `local`: a server directory. `s3`: an S3 bucket.'
      enum: [managed, local, s3]

    S3Settings:
      type: object
      required: [bucket, region, access_key_id]
      properties:
        endpoint: { type: string, format: uri, description: 'For S3-compatible stores; default AWS' }
        region: { type: string }
        bucket: { type: string }
        prefix: { type: string, description: Key prefix for the library's folders }
        path_style: { type: boolean, description: Path-style URLs (most S3-compatible stores) }
        access_key_id: { type: string }
        secret_access_key: { type: string, writeOnly: true, description: Write only; never returned }
        cdn_base_url: { type: string, format: uri, description: 'If set, players are redirected to <cdn_base_url>/<key> instead of a presigned URL' }
        part_size_mib: { type: integer, minimum: 5, maximum: 5120, default: 64, description: 'Files larger than this are uploaded and copied in parts of this size (larger when a file needs more than 10,000)' }

    Library:
      type: object
      required: [id, name, kind, position, used_bytes, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { $ref: '#/components/schemas/LibraryKind' }
        position: { type: integer }
        used_bytes: { type: integer, format: int64, description: Total size of the library's files }
        free_bytes: { type: integer, format: int64, description: 'Space left: the quota less used, or the disk''s free space, whichever is smaller; absent when unlimited' }
        quota_bytes: { type: integer, format: int64 }
        path: { type: string, description: 'local only, admins only' }
        s3:
          $ref: '#/components/schemas/S3Settings'
          description: s3 only, admins only (without the secret)
        created_at: { type: string, format: date-time }

    LibraryInput:
      type: object
      required: [name, kind]
      properties:
        name: { type: string }
        kind: { type: string, enum: [local, s3] }
        path: { type: string, description: local only }
        s3: { $ref: '#/components/schemas/S3Settings' }
        quota_bytes: { type: integer, format: int64 }

    LibraryPatch:
      type: object
      properties:
        name: { type: string }
        position: { type: integer }
        quota_bytes: { type: [integer, 'null'], format: int64, description: null removes the quota }
        path: { type: string }
        s3:
          type: object
          description: Fields to change; omitted ones keep their value
          properties:
            endpoint: { type: string }
            region: { type: string }
            bucket: { type: string }
            prefix: { type: string }
            path_style: { type: boolean }
            access_key_id: { type: string }
            secret_access_key: { type: string, writeOnly: true }
            cdn_base_url: { type: [string, 'null'] }
            part_size_mib: { type: integer, minimum: 5, maximum: 5120 }

    LibraryTestInput:
      type: object
      required: [kind]
      properties:
        library_id: { type: string, description: Fill in the stored secret from this library }
        kind: { type: string, enum: [local, s3] }
        path: { type: string }
        s3:
          type: object
          properties:
            endpoint: { type: string }
            region: { type: string }
            bucket: { type: string }
            prefix: { type: string }
            path_style: { type: boolean }
            access_key_id: { type: string }
            secret_access_key: { type: string, writeOnly: true }

    LibraryTestResult:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        message: { type: string, description: Why it failed }

    AdvanceMode:
      type: string
      description: What happens when an item finishes. `inherit` uses playlist defaults.
      enum: [inherit, auto, hold]

    WaitingDisplay:
      type: string
      enum: [inherit, hold_last_frame, loop, black]

    TransitionType:
      type: string
      enum: [cut, dissolve, push]

    Transition:
      type: object
      required: [type, duration_ms]
      properties:
        type: { $ref: '#/components/schemas/TransitionType' }
        duration_ms: { type: integer, minimum: 0, maximum: 10000 }

    ClipAudio:
      type: string
      description: How a video's own audio interacts with an active bed.
      enum: [inherit, mute, play, duck_bed, pause_bed]

    PlaylistDefaults:
      type: object
      required: [then, while_waiting, transition, image_duration_ms, clip_audio]
      properties:
        then:
          type: string
          enum: [auto, hold]
        while_waiting:
          type: string
          enum: [hold_last_frame, loop, black]
        transition: { $ref: '#/components/schemas/Transition' }
        image_duration_ms:
          type: integer
          minimum: 0
          description: 0 = until remote
        clip_audio:
          type: string
          enum: [mute, play, duck_bed, pause_bed]

    ItemKind:
      type: string
      enum: [video, image, sequence]

    PlaylistItem:
      type: object
      required: [kind]
      properties:
        id: { type: string, format: uuid, description: Server assigns if absent }
        kind: { $ref: '#/components/schemas/ItemKind' }
        media_id:
          type: string
          format: uuid
          description: Required for video/image
        pages:
          type: array
          description: Required for sequence (ordered image media IDs, e.g. rasterized PDF pages)
          items: { type: string, format: uuid }
        label: { type: string, description: Optional display name override }
        play_count:
          type: integer
          minimum: 0
          description: Video only. Absent = 1. 0 = loop forever (until remote/next).
        duration_ms:
          type: integer
          minimum: 0
          description: Image, or per page for sequence. Absent = playlist default. 0 = until remote.
        then: { $ref: '#/components/schemas/AdvanceMode' }
        while_waiting: { $ref: '#/components/schemas/WaitingDisplay' }
        transition:
          $ref: '#/components/schemas/Transition'
          description: Transition into the next item. Absent = playlist default.
        clip_audio: { $ref: '#/components/schemas/ClipAudio' }
        volume:
          type: number
          minimum: 0
          maximum: 1
          description: Clip audio volume. Absent = 1.

    Bed:
      type: object
      required: [start_item_id, end_item_id, tracks]
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        start_item_id: { type: string, format: uuid }
        end_item_id: { type: string, format: uuid, description: Inclusive. May equal start_item_id. }
        tracks:
          type: array
          minItems: 1
          items: { type: string, format: uuid, description: Audio media ID }
        shuffle: { type: boolean, default: false }
        volume: { type: number, minimum: 0, maximum: 1, default: 0.8 }
        duck_volume: { type: number, minimum: 0, maximum: 1, default: 0.2 }
        fade_ms: { type: integer, minimum: 0, default: 1500 }

    PlaylistInput:
      type: object
      required: [team_id, name]
      properties:
        team_id: { type: string, format: uuid }
        name: { type: string, minLength: 1 }
        folder_id: { type: [string, 'null'], format: uuid, description: A folder of the same team; null = team root }
        loop: { type: boolean, default: true, description: Restart at item 1 after the last item }
        defaults: { $ref: '#/components/schemas/PlaylistDefaults' }
        items:
          type: array
          items: { $ref: '#/components/schemas/PlaylistItem' }
        beds:
          type: array
          items: { $ref: '#/components/schemas/Bed' }

    PlaylistUpdate:
      type: object
      required: [base_version, name, loop, defaults, items, beds]
      properties:
        base_version: { type: integer, format: int64 }
        name: { type: string, minLength: 1 }
        loop: { type: boolean }
        defaults: { $ref: '#/components/schemas/PlaylistDefaults' }
        items:
          type: array
          items: { $ref: '#/components/schemas/PlaylistItem' }
        beds:
          type: array
          items: { $ref: '#/components/schemas/Bed' }

    PlaylistSummary:
      type: object
      required: [id, team_id, name, version, item_count, tag_ids, updated_at]
      properties:
        id: { type: string, format: uuid }
        team_id: { type: string, format: uuid }
        folder_id: { type: string, format: uuid }
        tag_ids:
          type: array
          items: { type: string, format: uuid }
        name: { type: string }
        version: { type: integer, format: int64 }
        item_count: { type: integer }
        total_bytes: { type: integer, format: int64 }
        updated_at: { type: string, format: date-time }

    Playlist:
      type: object
      required: [id, team_id, name, version, loop, defaults, items, beds, tag_ids, updated_at]
      properties:
        id: { type: string, format: uuid }
        team_id: { type: string, format: uuid }
        folder_id: { type: string, format: uuid, description: Absent = team root }
        tag_ids:
          type: array
          description: The playlist shows on screens sharing one of these tags; empty = nowhere
          items: { type: string, format: uuid }
        name: { type: string }
        version: { type: integer, format: int64 }
        loop: { type: boolean }
        defaults: { $ref: '#/components/schemas/PlaylistDefaults' }
        items:
          type: array
          items: { $ref: '#/components/schemas/PlaylistItem' }
        beds:
          type: array
          items: { $ref: '#/components/schemas/Bed' }
        updated_at: { type: string, format: date-time }
        updated_by: { type: string }

    PlaylistPatch:
      type: object
      required: [folder_id]
      properties:
        folder_id: { type: [string, 'null'], format: uuid }

    PlaylistChange:
      type: object
      required: [playlist, clashes, warnings]
      properties:
        playlist: { $ref: '#/components/schemas/Playlist' }
        clashes:
          type: array
          items: { $ref: '#/components/schemas/ScheduleClash' }
        warnings:
          type: array
          items: { $ref: '#/components/schemas/ChangeWarning' }

    PlaylistFolder:
      type: object
      required: [id, team_id, name, position, created_at]
      properties:
        id: { type: string, format: uuid }
        team_id: { type: string, format: uuid }
        parent_id: { type: string, format: uuid, description: Absent = top level }
        name: { type: string }
        position: { type: integer }
        created_at: { type: string, format: date-time }

    PlaylistFolderInput:
      type: object
      required: [team_id, name]
      properties:
        team_id: { type: string, format: uuid }
        parent_id: { type: [string, 'null'], format: uuid }
        name: { type: string, minLength: 1 }
        position: { type: integer, description: Defaults to last }

    PlaylistFolderPatch:
      type: object
      properties:
        parent_id: { type: [string, 'null'], format: uuid }
        name: { type: string, minLength: 1 }
        position: { type: integer }

    ScreenState:
      type: string
      enum: [offline, idle, caching, playing, holding, blackout, error]

    CacheProgress:
      type: object
      required: [ready, total, bytes_ready, bytes_total]
      properties:
        ready: { type: integer }
        total: { type: integer }
        bytes_ready: { type: integer, format: int64 }
        bytes_total: { type: integer, format: int64 }

    ScreenStatus:
      type: object
      required: [state]
      properties:
        state: { $ref: '#/components/schemas/ScreenState' }
        playlist_version: { type: integer, format: int64 }
        item_id: { type: string, format: uuid }
        item_index: { type: integer }
        holding: { type: boolean }
        cache: { $ref: '#/components/schemas/CacheProgress' }
        app_version: { type: string }
        os_version: { type: string }
        model: { type: string }
        message: { type: string, description: Human-readable error/detail }
        step_index: { type: integer, description: Current page within a sequence item }
        step_count: { type: integer, description: Pages in the current sequence item }
        item_count: { type: integer, description: Items in the playing playlist }
        position_ms: { type: integer, format: int64, description: Current video position; for timed images, the time left }
        duration_ms: { type: integer, format: int64, description: Current video length }
        blackout: { type: boolean }
        updated_at: { type: string, format: date-time }

    Screen:
      type: object
      required: [id, name, tag_ids, team_ids, output_keys, online, status, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        tag_ids:
          type: array
          description: Empty = untagged (plays nothing, flagged in notices)
          items: { type: string, format: uuid }
        team_ids:
          type: array
          description: Teams that reach this screen
          items: { type: string, format: uuid }
        fallback_playlist_id: { type: string, format: uuid, description: 'Plays when nothing is scheduled; absent = the home menu' }
        timezone: { type: string, description: 'IANA zone for this screen''s schedule; absent = the org zone' }
        override: { $ref: '#/components/schemas/ScreenOverride' }
        placement: { $ref: '#/components/schemas/ScreenPlacement' }
        node_id: { type: string, format: uuid, description: The node whose program outputs play this screen; absent = unplaced }
        output_keys:
          type: array
          description: The node's program outputs for this screen (identical frames)
          items: { type: string }
        online: { type: boolean, description: True while the screen's node has its socket open }
        status: { $ref: '#/components/schemas/ScreenStatus' }
        last_seen_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    ScreenPatch:
      type: object
      properties:
        name: { type: string }
        fallback_playlist_id:
          type: [string, 'null']
          format: uuid
          description: null = the home menu
        timezone:
          type: [string, 'null']
          description: IANA zone; null = the org zone
        placement:
          oneOf:
            - $ref: '#/components/schemas/ScreenPlacement'
            - type: 'null'
          description: null removes the screen from its floor plan

    ScreenChange:
      type: object
      required: [screen, clashes, warnings]
      properties:
        screen: { $ref: '#/components/schemas/Screen' }
        clashes:
          type: array
          items: { $ref: '#/components/schemas/ScheduleClash' }
        warnings:
          type: array
          items: { $ref: '#/components/schemas/ChangeWarning' }

    ScreenEventKind:
      type: string
      enum: [created, renamed, placed, fallback, timezone, tags, override, override_cleared, command]

    ScreenEvent:
      type: object
      required: [id, screen_id, kind, created_at]
      properties:
        id: { type: string, format: uuid }
        screen_id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/ScreenEventKind' }
        user_sub: { type: string, description: 'Who did it: a user subject, `bootstrap`, or a node id for device changes' }
        user_name: { type: string }
        team_id: { type: string, format: uuid, description: The team the actor acted for, when there is one }
        detail: { type: object, additionalProperties: true, description: 'Kind-specific, e.g. {"name": ...}, {"playlist_id": ...}, {"command": ...}' }
        created_at: { type: string, format: date-time }

    BulkOverrideInput:
      type: object
      properties:
        screen_ids:
          type: array
          items: { type: string, format: uuid }
        tag_ids:
          type: array
          items: { type: string, format: uuid }
        playlist_id: { type: [string, 'null'], format: uuid, description: null = blank }
        until: { type: [string, 'null'], format: date-time }
        clear: { type: boolean, default: false, description: Clear the overrides instead }

    BulkOverrideResult:
      type: object
      required: [screens, warnings]
      properties:
        screens:
          type: array
          items: { $ref: '#/components/schemas/Screen' }
        warnings:
          type: array
          items: { $ref: '#/components/schemas/ChangeWarning' }

    ScreenPlacement:
      type: object
      required: [floor_plan_id, x, y]
      properties:
        floor_plan_id: { type: string, format: uuid }
        x: { type: number, minimum: 0, maximum: 1, description: Fraction of the plan's width from the left }
        y: { type: number, minimum: 0, maximum: 1, description: Fraction of the plan's height from the top }

    FloorPlanInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        image_sha256:
          type: [string, 'null']
          pattern: '^[0-9a-f]{64}$'
          description: Uploaded blob; null draws a blank canvas
        image_width: { type: [integer, 'null'], minimum: 1 }
        image_height: { type: [integer, 'null'], minimum: 1 }
        position: { type: integer, description: Sort order; defaults to last }

    FloorPlan:
      allOf:
        - $ref: '#/components/schemas/FloorPlanInput'
        - type: object
          required: [id, position, created_at]
          properties:
            id: { type: string, format: uuid }
            created_at: { type: string, format: date-time }

    OutputKind:
      type: string
      enum: [display, external, built_in, decklink, virtual]

    NodeMode:
      type: string
      enum: [player, controller, stage]
      description: What the device is for. Controller and stage devices only use control, confidence and off.

    AssignmentJob:
      type: string
      enum: [program, control, confidence, off]
      description: |
        `program` shows the screen (a screen may have several program outputs, all on one node, all
        identical; at most one with audio). `control` and `confidence` target a screen on any node.

    AssignmentView:
      type: string
      enum: [remote, operator]

    AudioSettings:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
        device: { type: string }

    AssignmentSettings:
      type: object
      properties:
        audio: { $ref: '#/components/schemas/AudioSettings' }
        view: { $ref: '#/components/schemas/AssignmentView' }
        clock: { type: integer, enum: [12, 24] }
        format: { type: string, description: Video format }

    Assignment:
      type: object
      required: [output_key, job]
      properties:
        output_key: { type: string }
        job: { $ref: '#/components/schemas/AssignmentJob' }
        screen_id: { type: string, format: uuid, description: Target screen. Optional for a program job whose screen is not created yet; required for control and confidence; ignored for off }
        settings: { $ref: '#/components/schemas/AssignmentSettings' }
        updated_by: { type: string, description: Server-set, ignored on input }
        updated_at: { type: string, format: date-time, description: Server-set, ignored on input }

    Assignments:
      type: object
      required: [version, mode, assignments]
      properties:
        version: { type: integer, format: int64 }
        mode: { $ref: '#/components/schemas/NodeMode' }
        assignments:
          type: array
          items: { $ref: '#/components/schemas/Assignment' }

    AssignmentsInput:
      type: object
      required: [base_version, assignments]
      properties:
        base_version: { type: integer, format: int64 }
        assignments:
          type: array
          items: { $ref: '#/components/schemas/Assignment' }

    DeviceModeInput:
      type: object
      required: [mode]
      properties:
        mode: { $ref: '#/components/schemas/NodeMode' }

    MoveScreenInput:
      type: object
      required: [node_id, output_key]
      properties:
        node_id: { type: string, format: uuid }
        output_key: { type: string }

    OutputRole:
      type: string
      enum: [program, control, confidence, none]

    Output:
      type: object
      description: |
        One output a node reports (a display, a DeckLink port, a virtual output...). This is hardware.
        `role` and `screen_id` are server-maintained copies of the output's assignment; reports may omit them.
      required: [key, kind, name]
      properties:
        key: { type: string, description: Stable identifier the node matches outputs by }
        kind: { $ref: '#/components/schemas/OutputKind' }
        name: { type: string }
        role: { $ref: '#/components/schemas/OutputRole' }
        screen_id: { type: string, format: uuid, description: The screen this output plays (role=program); server-maintained }
        format: { type: string, description: 'Display mode, e.g. 1920x1080@59.94' }
        audio_device: { type: string }

    OutputStatus:
      type: object
      required: [key, connected]
      properties:
        key: { type: string }
        connected: { type: boolean }
        format: { type: string }
        audio_device: { type: string }
        dropped_frames: { type: integer, format: int64 }
        late_frames: { type: integer, format: int64 }

    NodeStatus:
      type: object
      required: [outputs, updated_at]
      properties:
        outputs:
          type: array
          items: { $ref: '#/components/schemas/OutputStatus' }
        updated_at: { type: string, format: date-time }

    Node:
      type: object
      description: Hardware only. A node has no team and no tags; permissions follow the screens it serves.
      required: [id, name, outputs, screen_ids, mode, assignments_version, applied_assignments_version, online, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        mode: { $ref: '#/components/schemas/NodeMode' }
        assignments_version: { type: integer, format: int64, description: Desired assignments version; bumps on every change }
        applied_assignments_version: { type: integer, format: int64, description: The version the device last reported (status messages) or applied itself; Pending while lower than assignments_version }
        model: { type: string }
        os_version: { type: string }
        app_version: { type: string }
        outputs:
          type: array
          items: { $ref: '#/components/schemas/Output' }
        screen_ids:
          type: array
          items: { type: string, format: uuid }
        online: { type: boolean }
        status: { $ref: '#/components/schemas/NodeStatus' }
        last_seen_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    NodePatch:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        mode: { $ref: '#/components/schemas/NodeMode' }

    DeviceNode:
      type: object
      required: [node, screens]
      properties:
        node: { $ref: '#/components/schemas/Node' }
        screens:
          type: array
          items: { $ref: '#/components/schemas/Screen' }

    DeviceScreenInput:
      type: object
      required: [output_key, name]
      properties:
        output_key: { type: string }
        name: { type: string }

    DevicePlaylistSelection:
      type: object
      required: [playlist_id]
      properties:
        screen_id: { type: string, format: uuid, description: Optional when the node has exactly one screen }
        playlist_id:
          type: [string, 'null']
          format: uuid
          description: null = the home menu

    ScreenOverride:
      type: object
      required: [set_at]
      properties:
        playlist_id: { type: [string, 'null'], format: uuid, description: null = blank }
        until: { type: string, format: date-time, description: Absent = until cleared }
        set_at: { type: string, format: date-time }
        set_by: { type: string, description: 'Subject of whoever set it (a node id when set on the device)' }
        set_by_name: { type: string }
        team_id: { type: string, format: uuid, description: 'The team it was set for ("Overridden by Sam (Facilities)")' }

    ScreenOverrideInput:
      type: object
      required: [playlist_id]
      properties:
        playlist_id: { type: [string, 'null'], format: uuid }
        until: { type: [string, 'null'], format: date-time }
        until_next_change:
          type: boolean
          description: Expire at the next scheduled change (ignored when `until` is set; until cleared if there is none).

    ScheduleEntryKind:
      type: string
      enum: [weekly, once]

    ScheduleEntryInput:
      type: object
      required: [team_id, playlist_id, kind]
      description: |
        `weekly`: `days` + `start_time`/`end_time`; an end at or before the start runs past midnight
        (equal = 24 h). Optional `starts_on`/`ends_on` (inclusive) bound the recurrence, and
        `skip_dates` lists occurrence start dates that don't run (one-off edits pair a skip with a `once` entry).
        `once`: `starts_at`/`ends_at`, end after start. Times are wall clock in each screen's zone.
        Targets: `screen_ids` and `tag_ids` both empty = team-wide (every screen the team reaches);
        otherwise the named screens plus the screens carrying any of the tags (only those the team reaches).
        Precedence: override > once > weekly > nothing-scheduled. Within a tier: screen match > tag match
        > team-wide, then the newest entry wins. An entry is skipped on a screen its playlist isn't
        available on. A null playlist plays black (`display: blank`).
      properties:
        team_id: { type: string, format: uuid }
        playlist_id: { type: [string, 'null'], format: uuid, description: null = blank }
        title: { type: string }
        screen_ids:
          type: array
          description: Screens the team reaches
          items: { type: string, format: uuid }
        tag_ids:
          type: array
          description: Tags the team holds
          items: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/ScheduleEntryKind' }
        enabled: { type: boolean, default: true }
        days:
          type: array
          description: ISO weekdays, 1 = Monday
          items: { type: integer, minimum: 1, maximum: 7 }
        start_time: { type: string, pattern: '^[0-9]{2}:[0-9]{2}(:[0-9]{2})?$' }
        end_time: { type: string, pattern: '^[0-9]{2}:[0-9]{2}(:[0-9]{2})?$' }
        starts_on: { type: string, format: date }
        ends_on: { type: string, format: date }
        skip_dates:
          type: array
          description: Weekly only. Local dates whose occurrence (by start date) is skipped.
          items: { type: string, format: date }
        starts_at: { type: string, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}(:[0-9]{2})?$', description: Local wall clock }
        ends_at: { type: string, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}(:[0-9]{2})?$', description: Local wall clock }

    ScheduleEntry:
      allOf:
        - $ref: '#/components/schemas/ScheduleEntryInput'
        - type: object
          required: [id, screen_ids, tag_ids, enabled, needs_resolution, created_at, updated_at]
          properties:
            id: { type: string, format: uuid }
            created_by: { type: string, description: Subject of the creator }
            needs_resolution: { type: boolean, description: 'A one-off that clashes with another one-off after an admin retag or reach change; the newer one plays' }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }

    ScheduleList:
      type: object
      required: [timezone, entries]
      properties:
        timezone: { type: string }
        entries:
          type: array
          items: { $ref: '#/components/schemas/ScheduleEntry' }

    SegmentSource:
      type: string
      enum: [override, once, weekly, default]
      description: '`default` = nothing scheduled (the fallback playlist, or the home menu)'

    SegmentDisplay:
      type: string
      enum: [playlist, home, blank]
      description: '`home` = the home menu with Choose Playlist (nothing scheduled and no fallback); `blank` = black (an entry or override with no playlist)'

    ScheduleSegment:
      type: object
      required: [starts_at, ends_at, source, display]
      properties:
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        playlist_id: { type: [string, 'null'], format: uuid, description: Set when display is playlist }
        source: { $ref: '#/components/schemas/SegmentSource' }
        display: { $ref: '#/components/schemas/SegmentDisplay' }
        entry_id: { type: string, format: uuid, description: Schedule entry for once/weekly }
        team_id: { type: string, format: uuid, description: Team of the entry or override }

    SchedulePreviewInput:
      allOf:
        - $ref: '#/components/schemas/ScheduleEntryInput'
        - type: object
          properties:
            entry_id: { type: string, format: uuid, description: The entry being edited, left out of the comparison }

    TimeRange:
      type: object
      required: [starts_at, ends_at]
      properties:
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }

    EntryRanges:
      type: object
      required: [entry_id, team_id, ranges]
      properties:
        entry_id: { type: string, format: uuid }
        team_id: { type: string, format: uuid }
        ranges:
          type: array
          items: { $ref: '#/components/schemas/TimeRange' }

    SchedulePreview:
      type: object
      required: [screens]
      properties:
        screens:
          type: array
          items:
            type: object
            required: [screen_id, wins, covered_by, covers, clashes]
            properties:
              screen_id: { type: string, format: uuid }
              wins:
                type: array
                description: Ranges this entry plays
                items: { $ref: '#/components/schemas/TimeRange' }
              covered_by:
                type: array
                description: Entries that play instead of this one, and when
                items: { $ref: '#/components/schemas/EntryRanges' }
              covers:
                type: array
                description: Entries this one would play over, and when
                items: { $ref: '#/components/schemas/EntryRanges' }
              clashes:
                type: array
                description: Blocking one-off clashes (saving would be 409)
                items: { $ref: '#/components/schemas/ScheduleClash' }

    ScreenTimeline:
      type: object
      required: [screen_id, segments]
      properties:
        screen_id: { type: string, format: uuid }
        segments:
          type: array
          items: { $ref: '#/components/schemas/ScheduleSegment' }

    ScheduleTimeline:
      type: object
      required: [timezone, screens]
      properties:
        timezone: { type: string }
        screens:
          type: array
          items: { $ref: '#/components/schemas/ScreenTimeline' }

    CommandName:
      type: string
      enum: [go, next, prev, blackout, reload, identify, jump]

    ScreenCommand:
      type: object
      required: [name]
      properties:
        name: { $ref: '#/components/schemas/CommandName' }
        item_index: { type: integer, description: Target item (with name=go or jump; required for jump) }
        step_index: { type: integer, description: Optional page within a sequence item (with name=jump) }

    PairingKind:
      type: string
      enum: [single, node]
      description: single (default) claims a node plus its one screen; node claims just a multi-output node

    PairingStartInput:
      type: object
      properties:
        kind: { $ref: '#/components/schemas/PairingKind' }
        mode: { $ref: '#/components/schemas/NodeMode' }
        model: { type: string }
        os_version: { type: string }
        app_version: { type: string }

    PairingSession:
      type: object
      required: [pairing_id, code, secret, expires_at]
      properties:
        pairing_id: { type: string, format: uuid }
        code: { type: string, description: 6 chars from an unambiguous alphabet (no 0/O/1/I) }
        secret: { type: string }
        expires_at: { type: string, format: date-time }

    PairingClaim:
      type: object
      required: [code, name]
      properties:
        code: { type: string }
        name: { type: string }
        tag_ids:
          type: array
          description: Single pairings only. The new screen's tags.
          items: { type: string, format: uuid }
        playlist_id: { type: string, format: uuid, description: Single pairings only. The screen's fallback. }

    PairingStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, claimed, expired]
        node_id: { type: string, format: uuid }
        screen_id: { type: string, format: uuid, description: Only for single pairings }
        device_token: { type: string, description: Returned once }

    ManifestAsset:
      type: object
      required: [sha256, size, mime, path]
      properties:
        sha256: { type: string }
        size: { type: integer, format: int64 }
        mime: { type: string }
        path: { type: string, description: 'Relative URL, e.g. /v1/blobs/<sha256>' }
        first_use_index: { type: integer, description: Index of the first item that needs it }

    PickerNode:
      type: object
      description: |
        One level of the on-TV picker: Team → folder → playlist, holding only branches with a playlist
        available on the screen. Teams are always the top level; a folder with a single child is
        replaced by that child.
      required: [kind, id, name]
      properties:
        kind: { type: string, enum: [team, folder, playlist] }
        id: { type: string, format: uuid }
        name: { type: string }
        children:
          type: array
          description: Teams and folders only
          items: { $ref: '#/components/schemas/PickerNode' }

    Manifest:
      type: object
      required: [screen_id, screen_name, organization_id, organization_name, timezone, tags, available_playlist_ids, picker, assets, media]
      properties:
        screen_id: { type: string, format: uuid }
        screen_name: { type: string }
        timezone: { type: string, description: The screen's zone (its own, else the org's) }
        tags:
          type: array
          description: The screen's tags; empty = untagged, which plays nothing
          items: { $ref: '#/components/schemas/Tag' }
        available_playlist_ids:
          type: array
          description: Every playlist (of any team) sharing a tag with the screen; all of them are cached
          items: { type: string, format: uuid }
        picker:
          type: array
          items: { $ref: '#/components/schemas/PickerNode' }
        organization_id: { type: string, description: 'The org this screen is paired to (self-hosted: server_id)' }
        organization_name: { type: string, description: 'Shown on the TV, e.g. "Paired to Grace Church"' }
        playlist:
          $ref: '#/components/schemas/Playlist'
          description: What plays now; absent when nothing does
        timeline:
          type: array
          description: Contiguous segments from now for the next 48 hours
          items: { $ref: '#/components/schemas/ScheduleSegment' }
        playlists:
          type: array
          description: Every available playlist (the timeline only references these). Items whose file is missing are left out, as are missing bed tracks; a bed whose start item was left out starts at the next item.
          items: { $ref: '#/components/schemas/Playlist' }
        media:
          type: array
          description: Every media record referenced by those playlists (never missing ones)
          items: { $ref: '#/components/schemas/Media' }
        assets:
          type: array
          description: Unique blobs in download-priority order (the active playlist first, then later timeline playlists by start time, then the remaining available playlists by name; within a playlist by first use, bed tracks with their start item)
          items: { $ref: '#/components/schemas/ManifestAsset' }

    WsServerMessageType:
      type: string
      enum: [hello, manifest_changed, command, screen_status, screen_online, screen_offline, screen_updated, screen_activity, node_online, node_offline, node_updated, node_status, schedule_changed, floor_plans_changed, tags_changed, media_changed, notice, assignments_changed, unpaired]

    WsServerMessage:
      type: object
      required: [type]
      description: Flat envelope; fields present depend on `type`.
      properties:
        type: { $ref: '#/components/schemas/WsServerMessageType' }
        server_id: { type: string, format: uuid, description: hello }
        version: { type: integer, format: int64, description: 'manifest_changed (informational; devices refetch with If-None-Match) and assignments_changed (the new assignments version; refetch getDeviceAssignments)' }
        team_id: { type: string, format: uuid, description: schedule_changed }
        folder_id: { type: string, format: uuid, description: 'media_changed: a folder or the files in it changed (absent when libraries or the folder tree changed); sent to every user' }
        command: { $ref: '#/components/schemas/ScreenCommand' }
        screen_id: { type: string, format: uuid, description: 'manifest_changed / command (device-facing) and screen_status / online / offline / updated / activity (users who reach the screen). A device also receives screen_status, manifest_changed, screen_online and screen_offline for screens it has a control or confidence assignment for (not played by itself)' }
        node_id: { type: string, format: uuid, description: node_online / node_offline / node_updated / node_status }
        status: { $ref: '#/components/schemas/ScreenStatus' }
        outputs:
          type: array
          description: node_status
          items: { $ref: '#/components/schemas/OutputStatus' }
        updated_at: { type: string, format: date-time, description: node_status }
        event: { $ref: '#/components/schemas/ScreenEvent' }
        notice: { $ref: '#/components/schemas/Notice' }

    NoticeKind:
      type: string
      enum: [schedule_conflict, untagged_screen, media_missing]

    Notice:
      type: object
      required: [id, kind, created_at]
      description: |
        `schedule_conflict`: `entry_id` needs resolution (it clashes with another one-off; `detail.clashes`).
        `untagged_screen`: `screen_id` has no tags and plays nothing (addressed to every admin).
        `media_missing`: a file a playlist uses was deleted (`detail.media_id`, `detail.name`,
        `detail.path`, `detail.playlist_ids`); addressed to each playlist's last editor. It resolves when
        no playlist uses the file any more.
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/NoticeKind' }
        screen_id: { type: string, format: uuid }
        entry_id: { type: string, format: uuid }
        detail: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time }
        dismissed_at: { type: string, format: date-time }

    WsClientMessageType:
      type: string
      enum: [status, node_status, ping]

    WsClientMessage:
      type: object
      required: [type]
      properties:
        type: { $ref: '#/components/schemas/WsClientMessageType' }
        screen_id: { type: string, format: uuid, description: status; optional when the node has exactly one screen }
        assignments_version: { type: integer, format: int64, description: 'Optional on any message: the assignments version the device is running. The server stores it as applied_assignments_version and sends node_updated to users when it changes.' }
        status: { $ref: '#/components/schemas/ScreenStatus' }
        outputs:
          type: array
          description: node_status
          items: { $ref: '#/components/schemas/OutputStatus' }
