# Single source of truth for product naming.
# Rename the product by editing this file, then run `scripts/apply-branding.sh`.
# Consumers:
#   flake.nix            -> builtins.fromTOML (package name, module option path, docker image name)
#   server/build.rs      -> compile-time constants (service name, Bonjour type, User-Agent)
#   apple/branding.yml   -> generated by scripts/apply-branding.sh, included by apple/project.yml

[product]
name = "Simple Screen"          # human-readable display name
slug = "simplescreen"           # lowercase, no spaces: binaries, nix attr, docker image, Bonjour
short = "Screen"                # Swift module/type prefix (ScreenKit, ScreenPlayback, ...)

[apple]
bundle_id_prefix = "studio.sevenand.simplescreen"
development_team = ""           # Apple Team ID; empty = sign locally / automatic
player_name = "Simple Screen"   # tvOS app display name
editor_name = "Simple Screen Studio"

[network]
bonjour_type = "_simplescreen._tcp"
default_port = 8420
